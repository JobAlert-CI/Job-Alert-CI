[project]
name = "jobalert-ci-server"
version = "0.1.0"
description = "API backend for JobAlert CI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.7.0",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy>=2.0.51",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "bcrypt>=4.1.2",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
